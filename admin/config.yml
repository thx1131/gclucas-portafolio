# Panel de edición (Sveltia CMS) para gclucas.art
#
# Cómo funciona: cada guardado acá crea un commit en una rama nueva y abre un PR
# en GitHub (editorial_workflow). Luis revisa el PR (con preview automático de
# Cloudflare Pages) y lo mergea a `main`. El merge dispara el build en Cloudflare
# Pages, que regenera el HTML y publica.
#
# OAuth App de GitHub + Worker (sveltia-cms-auth) ya desplegados (2026-09-09).
# Verificar que el callback URL de la OAuth App en GitHub sea exactamente:
#   https://sveltia-cms-auth.thx1131.workers.dev/callback
#
# Setup pendiente antes de que esto funcione (ver checklist en gclucas_traspaso.md):
#   1. Confirmar build command en el dashboard de Cloudflare Pages
#
# Media library: git-based nativa de Sveltia (NO Cloudinary). Decidido 2026-09-09
# tras verificar en el código fuente de Sveltia que su integración "cloudinary"
# requiere loguearse con la cuenta real de Cloudinary dentro de un iframe (el
# Media Library Console), lo que le daría a Lucas acceso para borrar/reemplazar
# directo cualquiera de las 144 obras existentes, sin pasar por el PR review.
# Con la media library nativa, Lucas sube la foto con su mismo login de GitHub
# y el archivo queda commiteado dentro del PR (Luis lo ve en el diff antes de
# aprobar). Detalle y backlog de esta decisión en gclucas_traspaso.md.

backend:
  name: github
  repo: thx1131/gclucas-portafolio
  branch: main
  base_url: https://sveltia-cms-auth.thx1131.workers.dev
  auth_endpoint: auth
  # Lucas entra con SU PROPIA cuenta de GitHub, sin ser colaborador del repo.
  # open_authoring: al loguearse, Sveltia le pide confirmación para forkear
  # gclucas-portafolio a su cuenta; sus cambios van a ese fork y desde ahí
  # abre un PR hacia este repo. Como no tiene acceso de escritura acá, no
  # puede mergear su propio PR — Luis sigue siendo el único que puede.
  # auth_scope: public_repo porque el repo es público, así el OAuth solo
  # pide acceso a los repos públicos de Lucas, no a todos los suyos (privados
  # incluidos), que es lo que pediría por default.
  open_authoring: true
  auth_scope: public_repo

publish_mode: editorial_workflow

site_url: https://gclucas.art
display_url: https://gclucas.art

media_folder: uploads
public_folder: /uploads

# NO declarar `media_library:` acá — Sveltia valida ese bloque como selector de
# backend (name: cloudinary/uploadcare/etc, o las claves planas access_key_id/
# bucket/container de un backend cloud tipo S3) y si no matchea ninguno tira
# "One of these options is required". Para configurar la librería default
# (git-based, la que usamos) sin ambigüedad se usa `media_libraries.all`.
media_libraries:
  all:
    slugify_filename: true

collections:
  - name: site
    label: "Sitio (statement, bio, contacto)"
    files:
      - name: site
        label: "Contenido global"
        file: data/site.json
        fields:
          # --- editable por Lucas ---
          - { name: author, label: "Nombre del artista", widget: string }
          - { name: descriptionEn, label: "Descripción corta (inglés, para SEO)", widget: text }
          - { name: descriptionEs, label: "Descripción corta (español, para SEO)", widget: text }
          - name: statementEn
            label: "Statement (inglés)"
            widget: list
            label_singular: "Párrafo"
            field: { name: paragraph, label: "Párrafo", widget: text }
          - name: statementEs
            label: "Statement (español)"
            widget: list
            label_singular: "Párrafo"
            field: { name: paragraph, label: "Párrafo", widget: text }
          - name: bioEn
            label: "Bio (inglés)"
            widget: list
            label_singular: "Párrafo"
            field: { name: paragraph, label: "Párrafo", widget: text }
          - name: bioEs
            label: "Bio (español)"
            widget: list
            label_singular: "Párrafo"
            field: { name: paragraph, label: "Párrafo", widget: text }
          - { name: email, label: "Email de contacto", widget: string }
          - { name: phone, label: "Teléfono (formato con espacios, ej. +52 415 151 1029)", widget: string }
          - { name: whatsapp_number, label: "WhatsApp (solo dígitos, sin +, ej. 524151511029)", widget: string, hint: "Debe ser el mismo número que 'Teléfono', solo que sin espacios ni +. Si cambia el teléfono, actualizar acá también." }
          - { name: whatsapp, label: "Link de WhatsApp completo", widget: string, hint: "Debe ser https://wa.me/ seguido de 'WhatsApp (solo dígitos)' de arriba. Si cambia el teléfono, actualizar acá también." }
          - { name: instagram, label: "Link de Instagram", widget: string }
          - { name: copyright, label: "Texto de copyright del footer", widget: string }
          # --- técnico, no tocar (se preserva oculto para no romper el sitio) ---
          - { name: title, widget: hidden }
          - { name: language, widget: hidden }
          - { name: url, widget: hidden }
          - name: colors
            widget: object
            hidden: true
            fields:
              - { name: bgLight, widget: hidden }
              - { name: bgDark, widget: hidden }
              - { name: textLight, widget: hidden }
              - { name: textDark, widget: hidden }
              - { name: borderLight, widget: hidden }
              - { name: borderDark, widget: hidden }
              - { name: accentLight, widget: hidden }
              - { name: accentDark, widget: hidden }

  - name: series
    label: "Series"
    files:
      - name: series
        label: "Todas las series"
        file: data/series.json
        fields:
          - name: series
            label: "Series"
            widget: list
            label_singular: "Serie"
            summary: "{{fields.titleEn}} ({{fields.year}})"
            fields:
              - { name: id, label: "ID (slug de la URL)", widget: string, hint: "NO cambiar en una serie ya publicada: rompe la URL /work/<id>/. Para una serie nueva, usar minúsculas y guiones, sin espacios ni acentos." }
              - { name: titleEn, label: "Título (inglés)", widget: string }
              - { name: titleEs, label: "Título (español)", widget: string }
              - { name: year, label: "Año", widget: number, value_type: int }
              - { name: statementEn, label: "Statement de la serie (inglés)", widget: text }
              - { name: statementEs, label: "Statement de la serie (español)", widget: text }
              - name: coverImage
                label: "Imagen de portada"
                widget: image
                media_folder: uploads/series
                public_folder: /uploads/series
                hint: "Las 144 obras originales usan URLs de Cloudinary (res.cloudinary.com); una foto nueva subida acá queda commiteada en el repo bajo /uploads/series/ — ambos formatos funcionan igual en el sitio."
              - { name: order, label: "Orden (menor = aparece primero)", widget: number, value_type: int }

  - name: works
    label: "Obras"
    files:
      - name: works
        label: "Todas las obras"
        file: data/works.json
        fields:
          - name: works
            label: "Obras"
            widget: list
            label_singular: "Obra"
            summary: "{{fields.titleEn}} — {{fields.series}}"
            fields:
              - name: cloudinaryUrl
                label: "Imagen"
                widget: image
                media_folder: uploads/works
                public_folder: /uploads/works
                hint: "Las 144 obras originales usan URLs de Cloudinary (res.cloudinary.com); una foto nueva subida acá queda commiteada en el repo bajo /uploads/works/ — ambos formatos funcionan igual en el sitio."
              - { name: id, label: "ID", widget: string, hint: "NO cambiar en una obra ya publicada." }
              - name: series
                label: "Serie"
                widget: relation
                collection: series
                file: series
                value_field: '{{series.*.id}}'
                search_fields: ['{{series.*.titleEn}}', '{{series.*.id}}']
                display_fields: ['{{series.*.titleEn}} ({{series.*.id}})']
                hint: "Buscá la serie por nombre — el ID se completa solo, ya no hay que tipearlo a mano."
              - { name: titleEn, label: "Título (inglés)", widget: string }
              - { name: titleEs, label: "Título (español)", widget: string }
              - { name: year, label: "Año", widget: number, value_type: int }
              - { name: technique, label: "Técnica (inglés)", widget: string }
              - { name: techniqueEs, label: "Técnica (español)", widget: string, required: false }
              - name: dimensions
                label: "Dimensiones"
                widget: object
                hint: "Caso normal: completá Alto/Ancho/Unidad. Pieza de edición con medida variable (ej. 0 quilates): tildá 'Medida variable' y dejá Alto/Ancho/Unidad vacíos. Caso excepcional que no entra en ninguno de los dos: usá 'Medida en texto libre' en vez de Alto/Ancho."
                fields:
                  - { name: height, label: "Alto", widget: number, required: false }
                  - { name: width, label: "Ancho", widget: number, required: false }
                  - { name: unit, label: "Unidad", widget: select, options: ["cm", "in"], required: false }
                  - { name: depth, label: "Profundidad (opcional)", widget: number, required: false }
                  - { name: variable, label: "Medida variable", widget: boolean, default: false, hint: "Piezas de edición donde cada unidad tiene una medida distinta (ej. 0 quilates)." }
                  - { name: raw, label: "Medida en texto libre (caso excepcional)", widget: string, required: false, hint: "Solo si no aplica ni Alto/Ancho ni 'Medida variable'." }
              - { name: order, label: "Orden dentro de la serie", widget: number, value_type: int, required: false }

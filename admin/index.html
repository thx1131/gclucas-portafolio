<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>gclucas — panel de edición</title>
    <style>
      /* Flujo editorial: sin min-height 0 las columnas crecen al largo de la lista y la
         lista no hace scroll (bug de Sveltia, visto en 0.251.0 con ~80 entradas). */
      .board .columns, .board .column { min-height: 0; }
    </style>
  </head>
  <body>
    <!-- Versión fija: sin ella cada navegador se queda hasta 7 días con la que bajó, y Luis y
         Lucas pueden ver paneles distintos. Para actualizar, cambiar el número en un PR. -->
    <script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.252.0/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>

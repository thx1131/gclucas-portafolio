<!-- series detail section -->
<section class="series-detail">
    <div class="container">
        <p class="series-breadcrumb"><a href="{{base}}/work/">← {{t_nav_work}}</a></p>

        <div class="series-header">
            <h1>{{series_title}}</h1>
            <p class="series-year">{{series_year}}</p>
        </div>

        {{series_nav_top}}

        <div class="series-statement">
            {{series_statement}}
        </div>

        <div class="gallery">
            {{gallery}}
        </div>

        {{series_nav}}
    </div>
</section>

<!-- modal para galería -->
<div class="modal" id="galleryModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose" aria-label="{{t_modal_close}}">&times;</button>
        <div class="modal-image">
            <img id="modalImage" src="" alt="">
        </div>
        <div class="modal-info">
            <h3 id="modalTitle"></h3>
            <p id="modalDimensions"></p>
            <p id="modalTechnique"></p>
            <p id="modalYear"></p>
        </div>
        <div class="modal-nav">
            <button class="modal-prev" id="modalPrev">{{t_modal_prev}}</button>
            <button class="modal-next" id="modalNext">{{t_modal_next}}</button>
        </div>
    </div>
</div>

<!-- contact section -->
<section class="contact-page">
    <div class="container">
        <h1>contact</h1>
        
        <div class="contact-content">
            <div class="contact-cards">
                <a class="contact-card" href="mailto:{{email}}">
                    <span class="contact-card-label">email</span>
                    <span class="contact-card-value">{{email}}</span>
                </a>
                <a class="contact-card" href="https://wa.me/{{whatsapp_number}}" target="_blank" rel="noopener noreferrer">
                    <span class="contact-card-label">whatsapp</span>
                    <span class="contact-card-value">send a message</span>
                </a>
                <a class="contact-card" href="{{instagram}}" target="_blank" rel="noopener noreferrer">
                    <span class="contact-card-label">instagram</span>
                    <span class="contact-card-value">@lucas.asecas</span>
                </a>
            </div>
        </div>
    </div>
</section>

<!-- hero section: editorial dos columnas (obra izquierda, identidad derecha) -->
<section class="hero">
    <div class="hero-inner">
        <div class="hero-artwork">
            <img src="{{hero_image}}" alt="gclucas — visual artist" loading="eager">
        </div>
        <div class="hero-content">
            <h1 class="hero-title">gclucas</h1>
            <p class="hero-tagline">visual artist exploring contradictions & transitions</p>
        </div>
    </div>
</section>

<!-- statement section -->
<section class="section" id="statement">
    <div class="container">
        <h2>statement</h2>
        {{statement_content}}
    </div>
</section>

<!-- work section -->
<section class="section" id="work">
    <div class="container">
        <h2><a href="/work/">work</a></h2>
        <p class="section-subtitle">explore the series</p>
        <div class="series-grid">
            {{series_preview}}
        </div>
    </div>
</section>

<!-- bio section -->
<section class="section" id="bio">
    <div class="container">
        <h2>bio</h2>
        {{bio_content}}
    </div>
</section>

<!-- contact section -->
<section class="section" id="contact">
    <div class="container">
        <h2>contact</h2>
        <div class="contact-content">
            {{contact_content}}
        </div>
    </div>
</section>
